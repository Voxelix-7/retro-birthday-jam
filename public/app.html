<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2d1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>For Marwan — Happy Birthday</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pacifico&display=swap"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <!-- PASSWORD -->
      <section class="screen active" data-screen="password">
        <div class="panel">
          <h1 class="title">Enter password</h1>
          <form id="password-form" autocomplete="off">
            <input
              id="password-input"
              type="password"
              inputmode="text"
              spellcheck="false"
              autocomplete="off"
              aria-label="Password"
            />
            <button type="submit" class="btn">Enter</button>
          </form>
          <p class="hint" id="password-hint">&nbsp;</p>
        </div>
      </section>

      <!-- BAT -->
      <section class="screen" data-screen="bat">
        <div class="bat-stage">
          <div id="bat-sprite" class="bat-sprite" role="button" tabindex="0" aria-label="Click the bat"></div>
          <div id="bat-message" class="bat-message hidden">
            <p id="bat-text"></p>
            <button id="get-started" class="btn hidden">Get started</button>
          </div>
        </div>
      </section>

      <!-- LEVEL MAP -->
      <section class="screen" data-screen="map">
        <canvas id="map-stars" class="map-stars"></canvas>
        <div class="map-moon"></div>
        <div class="map-content">
          <h1 class="map-title">Choose Your Chapter</h1>
          <div class="level-path" id="level-path"></div>
        </div>
        <div id="comingsoon-overlay" class="coming-soon hidden">
          <div class="coming-soon-box">
            <p>This chapter hasn't been written yet...</p>
            <button id="comingsoon-close" class="btn orange-btn">Back</button>
          </div>
        </div>
      </section>

      <!-- INTRO SLIDES (per-level instructions) -->
      <section class="screen" data-screen="intro">
        <div class="orange-panel intro-panel">
          <div class="intro-slides" id="intro-slides"></div>
          <div class="intro-nav">
            <button id="intro-prev" class="nav-arrow" aria-label="Previous page">◀</button>
            <div class="intro-dots" id="intro-dots"></div>
            <button id="intro-next" class="nav-arrow" aria-label="Next page">▶</button>
          </div>
          <div class="intro-start-wrap">
            <button id="intro-start" class="btn orange-btn hidden">Start!</button>
          </div>
        </div>
      </section>

      <!-- GAME -->
      <section class="screen" data-screen="game">
        <div class="game-wrap">
          <div class="hud">
            <span class="hud-label">Marwan</span>
            <div class="hud-bar"><div id="hud-progress"></div></div>
            <span class="hud-label" id="hud-target-label"></span>
          </div>
          <canvas id="game" width="960" height="360"></canvas>
          <div class="touch">
            <button class="tbtn" data-key="left" aria-label="Left">◀</button>
            <button class="tbtn" data-key="right" aria-label="Right">▶</button>
            <button class="tbtn" data-key="jump" aria-label="Jump">▲</button>
          </div>
        </div>
        <div id="game-fade" class="game-fade"></div>
        <div id="win-confirm-overlay" class="coming-soon hidden">
          <div class="coming-soon-box">
            <p id="win-confirm-text"></p>
            <div class="win-confirm-actions">
              <button id="win-confirm-no" class="btn ghost-outline hidden">No</button>
              <button id="win-confirm-yes" class="btn orange-btn">Yes</button>
            </div>
          </div>
        </div>
      </section>

      <!-- GAME OVER -->
      <section class="screen" data-screen="gameover">
        <div class="orange-panel gameover-panel">
          <div id="blink-sprite" class="blink-sprite"></div>
          <button id="retry" class="btn orange-btn">Try again</button>
        </div>
      </section>

      <!-- LEVEL END (fade-to-black message after winning a level) -->
      <section class="screen" data-screen="levelend">
        <div class="levelend-content">
          <p id="levelend-text" class="levelend-text"></p>
          <button id="levelend-ok" class="btn orange-btn">Ok</button>
        </div>
      </section>

      <!-- CHESS CUTSCENE (only reachable via the finale's chess-piece icon
           replay now — no longer shown automatically after winning level 2.
           Plays once, "Again?" replays it.) -->
      <section class="screen" data-screen="chesscutscene">
        <canvas id="chess-canvas" class="chess-canvas"></canvas>
        <div class="chesscutscene-actions">
          <button id="chesscutscene-again" class="btn ghost-outline">Again?</button>
          <button id="chesscutscene-ok" class="btn orange-btn">Ok</button>
        </div>
      </section>

      <!-- MUSIC PLAYER (level 3 ending — real playable album UI).
           Plain black background: just the player panel on the right, and
           Aya sitting tiny on top of the Ok button, centered lower screen. -->
      <section class="screen" data-screen="musicplayer">
        <div class="musicplayer-container">
          <div class="player-panel" id="player-panel">
            <img class="player-art" src="/sprites/album_art.png" alt="Album art" />
            <p class="player-tracktitle" id="player-tracktitle"></p>
            <div class="player-time">
              <span class="player-time-label" id="player-elapsed">0:00</span>
              <div class="player-progress" id="player-progress">
                <div class="player-progress-fill" id="player-progress-fill"></div>
              </div>
              <span class="player-time-label" id="player-duration">0:00</span>
            </div>
            <div class="player-controls">
              <button id="player-prev" class="player-btn" aria-label="Previous">⏮</button>
              <button id="player-playpause" class="player-btn player-btn--big" aria-label="Play">▶</button>
              <button id="player-next" class="player-btn" aria-label="Next">⏭</button>
            </div>
            <ul class="player-tracklist" id="player-tracklist"></ul>
          </div>
          <div class="musicplayer-ok-wrap">
            <div class="aya-sprite" id="aya-sprite"></div>
            <button id="musicplayer-ok" class="btn orange-btn musicplayer-ok">Ok</button>
          </div>
        </div>
        <audio id="player-audio"></audio>
      </section>

      <!-- FINALE (shown after completing Chapter IV) -->
      <section class="screen" data-screen="finale">
        <canvas id="finale-confetti" class="finale-confetti"></canvas>
        <div class="finale-content">
          <div class="finale-left">
            <h1 class="finale-title">Happy Birthday</h1>
            <h2 class="finale-subtitle">WanWan</h2>
            <div class="finale-icons">
              <button class="finale-icon-btn" id="finale-icon-envelope" aria-label="Replay Chapter I ending">
                <canvas id="finale-canvas-envelope" width="56" height="56"></canvas>
              </button>
              <button class="finale-icon-btn" id="finale-icon-chess" aria-label="Replay Chapter II ending">
                <canvas id="finale-canvas-chess" width="56" height="56"></canvas>
              </button>
              <button class="finale-icon-btn" id="finale-icon-cd" aria-label="Replay Chapter III ending">
                <img class="finale-icon-img" src="/sprites/cd.png" alt="CD" />
              </button>
              <button class="btn finale-map-btn" id="finale-icon-map">Map</button>
            </div>
          </div>
          <div class="finale-right">
            <div class="finale-cake" id="finale-cake"></div>
            <button class="btn finale-blow-btn" id="finale-blow-btn">Blow?</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Draggable floating player window — used only when opening the music
         player from the finale's CD icon (no background/spritesheet, just
         the player itself, reparented in from #player-panel above). -->
    <div id="finale-player-window" class="floating-player hidden">
      <div class="floating-player-titlebar" id="finale-player-titlebar">
        <span class="floating-player-title">Now Playing</span>
        <button class="floating-player-close" id="finale-player-close" aria-label="Close player">✕</button>
      </div>
      <div class="floating-player-body" id="finale-player-body"></div>
    </div>

    <!-- ROTATE-DEVICE OVERLAY: fallback for browsers/devices where the
         landscape orientation lock isn't supported or doesn't succeed.
         Pure CSS (see app.css, shown only via an `orientation: portrait`
         media query) — no JS detection required, so it can never get out
         of sync with reality. -->
    <div id="rotate-overlay" class="rotate-overlay" aria-hidden="true">
      <div class="rotate-overlay-content">
        <div class="rotate-icon"></div>
        <p>Please rotate your device to landscape to play.</p>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
